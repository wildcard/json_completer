name: Rust Integration Tests

on:
  push:
    branches: [ '**' ]  # Run on all branches
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    name: Rust Library and CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Run Rust tests
        run: |
          cd rust
          cargo test --workspace --verbose

      - name: Build release binary
        run: |
          cd rust
          cargo build --release --verbose

      - name: Verify binary works
        run: |
          ./target/release/json_completer '{"test":"value", "incomplete":'
          echo '{"action": "complete", "input": "{\"test\":"}' | ./target/release/json_completer --json-api

      - name: Run binary verification tests
        run: |
          cd rust/integration-tests
          ./verify-binary.sh

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: json_completer-binary
          path: target/release/json_completer
          retention-days: 7

  nestjs-integration:
    name: Nest.js Integration Tests
    runs-on: ubuntu-latest
    needs: rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: json_completer-binary
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/json_completer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Nest.js dependencies
        run: |
          cd rust/integration-tests/nestjs
          npm install

      - name: Run Nest.js integration tests
        run: |
          cd rust/integration-tests/nestjs
          npm test

      - name: Upload Nest.js test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-test-results
          path: rust/integration-tests/nestjs/coverage/
          retention-days: 7

  nextjs-integration:
    name: Next.js Integration Tests
    runs-on: ubuntu-latest
    needs: rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: json_completer-binary
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/json_completer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Next.js dependencies
        run: |
          cd rust/integration-tests/nextjs
          npm install

      - name: Run Next.js integration tests
        run: |
          cd rust/integration-tests/nextjs
          npm test

      - name: Upload Next.js test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-test-results
          path: rust/integration-tests/nextjs/coverage/
          retention-days: 7

  integration-summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [rust-tests, nestjs-integration, nextjs-integration]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Rust library and CLI tests completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Nest.js integration tests completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Next.js integration tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All integration tests passed successfully! 🎉" >> $GITHUB_STEP_SUMMARY
