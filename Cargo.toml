[workspace]
resolver = "2"
members = [
    "rust/json_completer",
    "rust/json_completer_cli",
    "python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["json_completer contributors"]
repository = "https://github.com/aha-app/json_completer"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
